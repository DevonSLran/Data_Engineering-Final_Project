version: 2

models:
  - name: stg_orders
    description: "One row per order, with parsed timestamps."
    columns:
      - name: order_id
        description: "Primary key — one row per order."
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced,
                       processing, created, approved]

  - name: stg_order_items
    description: "One row per item within an order (grain: order_id + order_item_id)."
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: order_item_id
        tests: [not_null]
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id
      - name: price
        tests: [not_null]

  - name: stg_customers
    description: "Customer keys per order. customer_id is order-scoped; customer_unique_id identifies the real person."
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_unique_id
        tests: [not_null]

  - name: stg_sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_order_payments
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_value
        tests: [not_null]

  - name: stg_order_reviews
    description: "Customer reviews. NOTE: review_id is intentionally not unique — Olist contains repeated review_ids spanning multiple orders."
    columns:
      - name: review_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false

  - name: stg_geolocation
    columns:
      - name: geolocation_zip_code_prefix
        tests: [not_null]
