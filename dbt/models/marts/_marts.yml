version: 2

models:
  - name: dim_customers
    description: "Customer dimension (grain: customer_id)."
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_products
    description: "Product dimension (grain: product_id)."
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: dim_sellers
    description: "Seller dimension (grain: seller_id)."
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: dim_date
    description: "Calendar dimension spanning all order purchase dates."
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: fct_order_items
    description: "Order-item fact at the line grain, the centre of the star schema."
    columns:
      - name: order_item_key
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
      - name: order_purchase_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: price
        tests: [not_null]
