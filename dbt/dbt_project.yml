name: "olist"
version: "1.0.0"
config-version: 2

profile: "olist"

model-paths: ["models"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  olist:
    # Silver: cleaned, typed, renamed — cheap to rebuild, so views.
    staging:
      +materialized: view
      +schema: staging
    # Gold: star schema consumed by Metabase — materialized as tables.
    marts:
      +materialized: table
      +schema: marts
